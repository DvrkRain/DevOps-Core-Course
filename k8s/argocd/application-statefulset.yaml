apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-info-service-statefulset
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DvrkRain/DevOps-Core-Course.git
    targetRevision: lab15
    path: k8s/devops-info-service
    helm:
      valueFiles:
        - values.yaml
        - values-statefulset.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: statefulset-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
