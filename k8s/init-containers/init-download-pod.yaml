# Lab 16 — Init Container demo (Task 3, pattern 1)
#
# An init container fetches a file from the network using `wget` and writes
# it into an `emptyDir` volume that is shared with the main container. The
# main container (nginx) then serves the downloaded content. This proves
# both that init containers run *before* the main container starts, and
# that data they produce is visible to the main container via shared
# volumes.
#
# Apply:
#   kubectl apply -f k8s/init-containers/init-download-pod.yaml
#
# Watch the init phase transition Init:0/1 -> PodInitializing -> Running:
#   kubectl get pod init-download -w
#
# Inspect the init container log:
#   kubectl logs init-download -c init-download
#
# Verify the main container can read the file the init container produced:
#   kubectl exec init-download -- cat /usr/share/nginx/html/index.html
#
# Verify nginx actually serves it (port-forward then curl):
#   kubectl port-forward pod/init-download 8088:80
#   curl http://localhost:8088/
apiVersion: v1
kind: Pod
metadata:
  name: init-download
  labels:
    app: init-download
    lab: lab16
spec:
  restartPolicy: OnFailure
  initContainers:
    - name: init-download
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eux
          echo "[init] downloading https://example.com into /work-dir/index.html"
          wget -q -O /work-dir/index.html https://example.com
          echo "[init] downloaded $(wc -c < /work-dir/index.html) bytes"
          ls -l /work-dir
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: web
      image: nginx:alpine
      ports:
        - containerPort: 80
          name: http
      volumeMounts:
        - name: workdir
          mountPath: /usr/share/nginx/html
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
  volumes:
    - name: workdir
      emptyDir: {}
