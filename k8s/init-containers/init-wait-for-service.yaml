# Lab 16 — Init Container demo (Task 3, pattern 2): wait-for-service
#
# Pattern: a workload depends on another Service being reachable before it
# starts. The init container blocks (looping nslookup) until the dependency
# is resolvable inside the cluster, then exits 0 and the main container
# starts.
#
# This manifest expects the Lab 15 StatefulSet (`devops-info-service`) to be
# running in the same namespace, which exposes the headless service
# `devops-info-service-headless`. With the StatefulSet up, this Pod will go
# Init:0/1 -> Init:1/1 -> Running in a few seconds.
#
# To reproduce the "stuck in Init" failure mode, change `SERVICE_FQDN` below
# to a name that does not exist (e.g. `does-not-exist.default.svc.cluster.local`)
# and re-apply: the pod will sit in Init:0/1 forever because nslookup never
# succeeds, which is exactly the wait pattern in action.
#
# Apply:
#   kubectl apply -f k8s/init-containers/init-wait-for-service.yaml
#
# Watch:
#   kubectl get pod init-wait -w
#
# Init log:
#   kubectl logs init-wait -c wait-for-service
#
# Main container log (it hits /health on the StatefulSet Service):
#   kubectl logs init-wait -c probe
apiVersion: v1
kind: Pod
metadata:
  name: init-wait
  labels:
    app: init-wait
    lab: lab16
spec:
  restartPolicy: OnFailure
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      env:
        # FQDN avoids busybox `nslookup`'s search-domain quirk: when given a
        # short name (e.g. `devops-info-service-headless`), busybox tries
        # every entry in /etc/resolv.conf's `search` list and exits 1 if
        # ANY of them returns NXDOMAIN — even when the desired name resolves
        # successfully. Using the fully-qualified name short-circuits that.
        - name: SERVICE_FQDN
          value: devops-info-service-headless.default.svc.cluster.local
      command:
        - sh
        - -c
        - |
          set -u
          echo "[init] waiting for service '$SERVICE_FQDN' to be resolvable..."
          attempt=0
          until nslookup "$SERVICE_FQDN" >/dev/null 2>&1; do
            attempt=$((attempt + 1))
            echo "[init] attempt $attempt: '$SERVICE_FQDN' not resolvable yet, sleeping 2s"
            sleep 2
          done
          echo "[init] '$SERVICE_FQDN' is resolvable after $attempt attempts:"
          nslookup "$SERVICE_FQDN"
  containers:
    - name: probe
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          echo "[probe] init finished, hitting devops-info-service /health"
          wget -q -O - http://devops-info-service/health || true
          echo
          echo "[probe] sleeping forever so the Pod stays Running for inspection"
          while true; do sleep 3600; done
