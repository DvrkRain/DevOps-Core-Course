replicaCount: 3

image:
  tag: "latest"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

appConfig:
  host: "0.0.0.0"
  port: "5000"
  debug: "False"

config:
  environment: "canary-demo"
  logLevel: "info"

persistence:
  enabled: false

rollout:
  strategy: canary
  revisionHistoryLimit: 5
  canary:
    steps:
      - setWeight: 33
      - pause:
          duration: 20s
      - setWeight: 66
      - pause:
          duration: 20s
      - setWeight: 100
    analysis:
      enabled: true
      templateName: success-rate
