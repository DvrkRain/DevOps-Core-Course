apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "common.fullname" . }}-post-install"
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "common.fullname" . }}-post-install"
      labels:
        {{- include "common.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-smoke-test
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "=== Post-install smoke test ==="
              echo "Waiting for service to become available..."
              sleep 10
              echo "Checking service endpoint..."
              wget -qO- --timeout=5 http://{{ include "common.fullname" . }}:{{ .Values.service.port }}/health || echo "Service not reachable yet (may still be starting)"
              echo ""
              echo "=== Post-install smoke test completed ==="
  backoffLimit: 1
