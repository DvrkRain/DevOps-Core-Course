replicaCount: 1

image:
  repository: timursalakhov/devops-info-service
  tag: "latest"
  pullPolicy: Never

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

appConfig:
  host: "0.0.0.0"
  port: "5000"
  debug: "False"

secret:
  enabled: true
  data:
    username: "placeholder-user"
    password: "placeholder-pass"

vault:
  enabled: false
  role: "devops-info-service"
  secretPath: "secret/data/devops-info-service/config"

config:
  environment: "dev"
  logLevel: "debug"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""
