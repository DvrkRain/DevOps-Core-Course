replicaCount: 2

image:
  tag: "latest"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

appConfig:
  host: "0.0.0.0"
  port: "5000"
  debug: "False"

config:
  environment: "bluegreen"
  logLevel: "info"

persistence:
  enabled: false

rollout:
  strategy: blueGreen
  revisionHistoryLimit: 5
  blueGreen:
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30
