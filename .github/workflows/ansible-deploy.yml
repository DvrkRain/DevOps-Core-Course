name: Ansible Deployment

on:
  push:
    branches: [main, master]
    paths:
      - 'ansible/**'
      - '!ansible/docs/**'
      - '.github/workflows/ansible-deploy.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'ansible/**'
      - '!ansible/docs/**'

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible and lint
        run: |
          pip install ansible ansible-lint

      - name: Install required collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write vault password file
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$VAULT_PASS" > ~/.vault_pass_lab05
          chmod 600 ~/.vault_pass_lab05

      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint playbooks/provision.yml playbooks/deploy.yml

  deploy:
    name: Deploy Application
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          pip install ansible

      - name: Install required collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519_devops
          chmod 600 ~/.ssh/id_ed25519_devops
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Write vault password file
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$VAULT_PASS" > ~/.vault_pass_lab05
          chmod 600 ~/.vault_pass_lab05

      - name: Deploy with Ansible
        run: |
          cd ansible
          ansible-playbook playbooks/deploy.yml \
            -i inventory/hosts.ini

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.VM_HOST }}:5000/health || exit 1
          echo "Deployment verified: app responding on port 5000"
