---
# Double-gating: BOTH the tag (web_app_wipe) AND the variable (web_app_wipe=true)
# must be explicitly provided. The tag gate prevents accidental execution during
# normal deployments; the variable gate acts as a confirmation prompt via -e.
- name: Wipe web application
  block:
    - name: Stop and remove containers via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: true

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully from {{ compose_project_dir }}"

  when: web_app_wipe | bool
  tags:
    - web_app_wipe
