---
- name: Install system packages
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Fix apt cache and retry installation
      ansible.builtin.apt:
        update_cache: true
        fix_missing: true

    - name: Retry common package installation after fix
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  always:
    - name: Log packages block completion
      ansible.builtin.copy:
        content: "common role packages block completed\n"
        dest: /tmp/ansible_common_packages.log
        mode: "0644"
      changed_when: false

  become: true
  tags:
    - packages

- name: Configure system settings
  block:
    - name: Set system timezone
      community.general.timezone:
        name: "{{ system_timezone }}"

  become: true
  tags:
    - users
