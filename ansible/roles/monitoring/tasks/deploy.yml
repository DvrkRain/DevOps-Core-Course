---
- name: Deploy monitoring stack
  become: true
  block:
    - name: Start monitoring stack with Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_base_dir }}"
        state: present
        pull: missing

    - name: Wait for Loki to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_loki_port }}/ready"
        status_code: 200
      register: loki_ready
      retries: 12
      delay: 10
      until: loki_ready.status == 200

    - name: Wait for Grafana to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_grafana_port }}/api/health"
        status_code: 200
      register: grafana_ready
      retries: 12
      delay: 10
      until: grafana_ready.status == 200

    - name: Configure Loki data source in Grafana
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_grafana_port }}/api/datasources"
        method: POST
        user: "{{ monitoring_grafana_admin_user }}"
        password: "{{ monitoring_grafana_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: Loki
          type: loki
          url: "http://loki:{{ monitoring_loki_port }}"
          access: proxy
          isDefault: true
          jsonData: {}
        status_code: [200, 409]
      register: datasource_result
      changed_when: datasource_result.status == 200

  rescue:
    - name: Log deployment failure
      ansible.builtin.debug:
        msg: "Monitoring stack deployment failed — check container logs for details."

    - name: Show compose logs on failure
      ansible.builtin.command:
        cmd: docker compose logs --tail=50
        chdir: "{{ monitoring_base_dir }}"
      changed_when: false
      ignore_errors: true
